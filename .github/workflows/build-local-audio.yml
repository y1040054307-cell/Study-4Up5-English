name: Build local audio pack

on:
  push:
    branches: [main]
    paths:
      - "tools/audio-list.json"
      - "tools/build-natural-audio.mjs"
      - ".github/workflows/build-local-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build domestic natural voice packs
        run: node tools/build-natural-audio.mjs
      - name: Validate generated audio packs
        run: node tools/validate-audio-pack.mjs
      - name: Commit generated natural audio
        run: |
          git config user.name "Sunny English Audio Builder"
          git config user.email "actions@users.noreply.github.com"
          git rm -f assets/audio-pack.bin assets/phoneme-pack.bin 2>/dev/null || true
          git add -A assets/audio audio-index.js phoneme-audio.js
          git diff --cached --quiet || git commit -m "Build natural English audio packs"
          git push
